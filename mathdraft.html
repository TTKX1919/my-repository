        id="bingForm"
        class="item"
        method="get"
        action=""

      >

          type="text"
          id="txtbing"
          name="q"
          size="10"
          maxlength="100%"
          value=""
        />

        <input type="hidden" id="hidb" name="ie" value="GB2312" />
        <input
          type="submit"
          id="subbing"
          name="btnG"
          value="Bing"
          formaction="http://cn.bing.com/search"
        />
      </form>

    <nav id="nav">
      <a href="https://www.1d9z.com">一点就转</a>

    <main id="main">
      <div id="blank"></div>
      <div id="buttons">
        <h1>这是一个用来记草稿的<abbr>html页面</abbr>：</h1>
        <em>点击黑色按钮在文本末尾添加html实体字符；点击br按钮添加换行符；</em>
        <button class="buttons" onclick="madd()">&#43;</button
        ><button class="buttons" onclick="mreduce()">&#45;</button
        ><button class="buttons" onclick="mride()">&#42;</button
        ><button class="buttons" onclick="mdivide()">&#47;</button
        ><button class="buttons" onclick="mequal()">&#61;</button
        ><button class="buttons" onclick="msup()">sup</button
        ><button class="buttons" onclick="msub()">sub</button
        ><button class="buttons" onclick="mlparenthesis()">&#40;</button
        ><button class="buttons" onclick="mrparenthesis()">&#41;</button
        ><button class="buttons" onclick="mlbracket()">&#91;</button
        ><button class="buttons" onclick="mrbracket()">&#93;</button
        ><button class="buttons" onclick="mlbrace()">&#123;</button
        ><button class="buttons" onclick="mrbrace()">&#125;</button
        ><button class="buttons" onclick="mlabracket()">&#60;</button
        ><button class="buttons" onclick="mrabracket()">&#62;</button
        ><button class="buttons" onclick="msqrt()">
          <math><msqrt></msqrt></math></button
        ><button class="buttons" onclick="mroot()">
          <math
            ><mroot><mi></mi><mn>3</mn></mroot></math
          >
        </button>
        <button class="buttons" onclick="mareduce()">&#177;</button
        ><em
          ><br />点击clear按钮清空文本域；点击refresh-page按钮刷新页面；点击view按钮或黑色按钮，显示文本框内容到右侧。</em
        ><button id="cbutton" onclick="nltext()">br</button>
        <button id="cbutton" onclick="ctext()">clear</button>
        <button id="rbutton" onclick="rpage()">refresh-page</button>
        <button id="vbutton" onclick="vtext()">view</button>
      </div>
      <textarea id="text1"></textarea>
      <div id="viewarea"></div>
    </main>
    <footer></footer>
